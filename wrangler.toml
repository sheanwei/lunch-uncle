name = "lunch-uncle"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Serve the chat page from a plain HTML file, imported as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Per-IP rate limit for POST /chat (see withinRateLimit in src/index.js).
# Every chat costs LLM and Places calls, so this caps what one visitor can
# spend. namespace_id is shared by every Worker in the Cloudflare account
# that uses the same number, so give each team's Worker its own.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secrets (OPENCODE_API_KEY, GOOGLE_PLACES_API_KEY) are set with
# `wrangler secret put` for deploys and `.env` for local development.
# Never put them in this file.
